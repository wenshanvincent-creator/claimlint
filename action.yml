name: claimlint documentation check
description: Check Markdown and Python agent instructions against source evidence
inputs:
  path:
    description: Project directory containing pyproject.toml
    default: .
  select:
    description: Optional comma-separated check IDs
    default: ''
  min-severity:
    description: Minimum failing severity (note, warning, error)
    default: warning
  baseline:
    description: Optional baseline file relative to the workspace
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'
    - name: Install claimlint
      shell: bash
      env:
        CLAIMLINT_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$CLAIMLINT_ACTION_PATH"
    - name: Check documentation
      shell: bash
      env:
        CLAIMLINT_PATH: ${{ inputs.path }}
        CLAIMLINT_SELECT: ${{ inputs.select }}
        CLAIMLINT_SEVERITY: ${{ inputs.min-severity }}
        CLAIMLINT_BASELINE: ${{ inputs.baseline }}
      run: |
        args=(check "$CLAIMLINT_PATH" --format github --min-severity "$CLAIMLINT_SEVERITY" --summary "$GITHUB_STEP_SUMMARY")
        if [ -n "$CLAIMLINT_SELECT" ]; then args+=(--select "$CLAIMLINT_SELECT"); fi
        if [ -n "$CLAIMLINT_BASELINE" ]; then args+=(--baseline "$CLAIMLINT_BASELINE"); fi
        python -m claimlint "${args[@]}"
